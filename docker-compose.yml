services:
  app:
    build:
      context: ./HerWay Beacon
      dockerfile: Dockerfile
    container_name: herway-beacon
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    env_file:
      - path: ./HerWay Beacon/.env
        required: false
    volumes:
      - app-data:/app/.data

volumes:
  app-data:
    driver: local

